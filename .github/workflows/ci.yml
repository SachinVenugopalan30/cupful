# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit has Signed-off-by
        run: |
          fail=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by line (use git commit -s; see CONTRIBUTING.md)"
              fail=1
            fi
          done
          exit $fail

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (embedded and served by the tests)
        working-directory: web
        run: npm ci && npm run build
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: server
      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: sqlx-cli
      - run: cargo fmt --check
      - name: SQLx offline metadata is current
        run: |
          export DATABASE_URL="sqlite://$RUNNER_TEMP/ci.db"
          sqlx database create
          sqlx migrate run --source migrations
          cargo sqlx prepare --check -- --all-targets
      - run: cargo clippy --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      - run: cargo test
        env:
          SQLX_OFFLINE: "true"
      # E2E needs the Rust server, so it runs here, reusing the debug build.
      - name: Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium && npm run test:e2e
        env:
          SQLX_OFFLINE: "true"

  docker:
    needs: [web, rust]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Main only needs the native image smoke test. Tags build both architectures.
        arch: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["amd64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      # Startup runs the migrations, including the FTS5 check, so a healthy container proves FTS5 on that arch.
      - name: Smoke test ${{ matrix.arch }}
        run: |
          arch="${{ matrix.arch }}"
          docker buildx build \
            --platform "linux/$arch" \
            --tag "cupful:$arch" \
            --load \
            --cache-from "type=gha,scope=cupful-$arch" \
            --cache-to "type=gha,mode=max,scope=cupful-$arch" \
            .
          docker run -d --name "cupful-$arch" --platform "linux/$arch" -p 8080 "cupful:$arch"
          port=$(docker port "cupful-$arch" 8080 | head -1 | cut -d: -f2)
          for i in $(seq 1 30); do curl -sf "localhost:$port/api/health" && break; sleep 1; done
          curl -sf "localhost:$port/api/health" || { docker logs "cupful-$arch"; exit 1; }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR rejects uppercase names, and github.repository keeps the owner's case.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=cupful-amd64
            type=gha,scope=cupful-arm64
          cache-to: type=gha,mode=max,scope=cupful-publish
